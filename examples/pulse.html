<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;overflow:hidden;
       background:#0b0f14;font-family:system-ui,sans-serif;color:#f5f5f5}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  h1{position:relative;font-size:46px;letter-spacing:-.03em;margin:0;
     animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <h1>Rendered frame by frame</h1>
<script>
  // Canvas + rAF work because the renderer drives rAF on a virtual clock.
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  function draw(t){
    ctx.clearRect(0, 0, c.width, c.height);
    for (let i = 0; i < 40; i++){
      const p = (t / 1000 + i / 40) % 1;
      ctx.beginPath();
      ctx.arc(c.width / 2, c.height / 2, p * c.width * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(240,180,41,${(1 - p) * 0.35})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
